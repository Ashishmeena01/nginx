<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Explore Nginx load balancing across five Node.js backends." />
    <title>Nginx Load Balancing Lab</title>
    <style>
        body { font: 1rem/1.5 system-ui, sans-serif; margin: 0; padding: 2rem; }
        main { max-width: 42rem; margin: 4rem auto; }
        button { border: 0; border-radius: .4rem; padding: .7rem 1rem; cursor: pointer; }
        button:disabled { cursor: wait; opacity: .65; }
        pre { overflow: auto; padding: 1rem; border-radius: .4rem; background: color-mix(in srgb, CanvasText 8%, Canvas); }
        @media (max-width: 40rem) { body { padding: 1rem; } main { margin: 2rem auto; } }
    </style>
</head>

<body>
    <main>
    <h1>Nginx Load Balancing Lab</h1>
    <p>This page is served by Nginx. Send a request to see which backend handles it.</p>

    <button id="btn">Call a backend</button>
    <pre id="output" aria-live="polite">Click the button to test.</pre>
    </main>

    <script>
        document.getElementById("btn").addEventListener("click", async (event) => {
            const button = event.currentTarget;
            const output = document.getElementById("output");
            button.disabled = true;
            output.textContent = "Loading...";

            try {
                const response = await fetch("/api/");
                if (!response.ok) throw new Error(`Request failed (${response.status})`);
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
